# Entrada única no Compose, com as mesmas rotas que o Ingress (Traefik) terá no Kubernetes:
#   /agenda     -> agenda      (GET /agenda?especialidade=..&dia=..)
#   /marcacoes  -> marcacoes   (POST /marcacoes, GET/DELETE /marcacoes/:id)
server {
    listen 8080;

    # DNS do Docker com validade curta: um contentor recriado (nova IP) volta a ser encontrado.
    resolver 127.0.0.11 valid=5s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /agenda {
        set $agenda http://agenda:3001;
        proxy_pass $agenda;
    }

    location /marcacoes {
        set $marcacoes http://marcacoes:3002;
        proxy_pass $marcacoes;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }
}
